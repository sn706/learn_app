<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>പ്രകാശത്തിന്റെ പ്രതിപതനം - ആനിമേഷൻ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            margin: 0;
            padding: 10px;
        }
        h2 {
            color: #1b4d3e;
            font-size: 1.4rem;
        }
        p {
            font-size: 0.95rem;
            color: #555;
            padding: 0 10px;
        }
        .canvas-container {
            width: 100%;
            display: flex;
            justify-content: center;
            overflow: hidden;
            margin-top: 10px;
        }
        canvas {
            background-color: #ffffff;
            border: 2px solid #ccc;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            max-width: 100%;
            height: auto;
        }
        .controls {
            margin-top: 15px;
            padding: 0 10px;
        }
        label {
            font-weight: bold;
            color: #333;
            font-size: 0.95rem;
        }
        input[type="range"] {
            width: 100%;
            max-width: 300px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h2>പ്രകാശത്തിന്റെ പ്രതിപതനം (Reflection of Light)</h2>
    <p>സ്ലൈഡർ ഉപയോഗിച്ച് പതനകോൺ മാറ്റി പരീക്ഷിക്കൂ.</p>

    <div class="canvas-container">
        <canvas id="canvas" width="600" height="400"></canvas>
    </div>

    <div class="controls">
        <label for="angleRange">പതനകോൺ (Angle of Incidence): <span id="angleValue">45</span>°</label><br>
        <input type="range" id="angleRange" min="10" max="80" value="45">
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const angleRange = document.getElementById('angleRange');
        const angleValue = document.getElementById('angleValue');

        const centerX = 300;
        const centerY = 300;
        const mirrorWidth = 400;

        function draw(angleDeg) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Mirror (സമതല ദർപ്പണം)
            ctx.fillStyle = '#888';
            ctx.fillRect(centerX - mirrorWidth / 2, centerY, mirrorWidth, 10);
            
            // Mirror hatching lines
            ctx.strokeStyle = '#555';
            for (let i = -mirrorWidth / 2; i <= mirrorWidth / 2; i += 20) {
                ctx.beginPath();
                ctx.moveTo(centerX + i, centerY + 10);
                ctx.lineTo(centerX + i - 10, centerY + 20);
                ctx.stroke();
            }

            // 2. Draw Normal Line (ലംബം - Dotted Line)
            ctx.strokeStyle = '#999';
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.lineTo(centerX, centerY - 200);
            ctx.stroke();
            ctx.setLineDash([]); // Reset dash

            // Normal label
            ctx.fillStyle = '#666';
            ctx.font = '14px Arial';
            ctx.fillText('ലംബം (Normal)', centerX + 10, centerY - 150);

            // 3. Calculate Ray coordinates
            const angleRad = (angleDeg * Math.PI) / 180;
            const rayLength = 220;

            const startX = centerX - rayLength * Math.sin(angleRad);
            const startY = centerY - rayLength * Math.cos(angleRad);

            const endX = centerX + rayLength * Math.sin(angleRad);
            const endY = centerY - rayLength * Math.cos(angleRad);

            // Draw Incident Ray
            ctx.strokeStyle = '#d9534f';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(centerX, centerY);
            ctx.stroke();

            // Draw Reflected Ray
            ctx.strokeStyle = '#f0ad4e';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.lineTo(endX, endY);
            ctx.stroke();

            // Labels for Rays
            ctx.fillStyle = '#d9534f';
            ctx.fillText('പതനരശ്മി', startX - 50, startY - 10);

            ctx.fillStyle = '#f0ad4e';
            ctx.fillText('പ്രതിപതനരശ്മി', endX + 10, endY - 10);

            // Draw Angle Arcs
            ctx.strokeStyle = '#337ab7';
            ctx.lineWidth = 1.5;

            ctx.beginPath();
            ctx.arc(centerX, centerY, 40, -Math.PI / 2 - angleRad, -Math.PI / 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(centerX, centerY, 40, -Math.PI / 2, -Math.PI / 2 + angleRad);
            ctx.stroke();

            // Angle text
            ctx.fillStyle = '#337ab7';
            ctx.font = '12px Arial';
            ctx.fillText(`i = ${angleDeg}°`, centerX - 30, centerY - 20);
            ctx.fillText(`r = ${angleDeg}°`, centerX + 15, centerY - 20);
        }

        angleRange.addEventListener('input', (e) => {
            const val = e.target.value;
            angleValue.innerText = val;
            draw(val);
        });

        draw(45);
    </script>

</body>
</html>
